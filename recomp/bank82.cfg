bank = 82
# Decompressor with path-dependent pushes ($4D selects the shape) that the
# exit solver cannot close. Both exits are RTL in M=1/X=0: $B31F after the
# copy loop (P untouched), $B32E after an explicit SEP #$20 / REP #$10.
exit_mx_at 82B2DA 1 0

# Assertion in the track loader: LDA $7F000B / BNE / BRK #$00 at $82:E1D7.
data_region 82 E1D7 E1D9

# >>> BEGIN symbols.toml (generated — do not edit)
func WaitForNMI_spin d4ee entry_mx:1,0
# <<< END symbols.toml

# $8151 Snd_IncDataPtr: PHP ... PLP ; RTS -> exits in its entry mode (the solver
# merges its SEP #$20 branch into an {M0,M1} set, mis-widening $80BF).
exit_mx_variant 828151 0 0 0 0
exit_mx_variant 828151 1 0 1 0
