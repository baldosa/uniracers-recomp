bank = 80

# $80:94EB prints a message, fades in ($9869 returns) and halts on BRK at
# $9504 (the text it prints starts at $9505): execute it exactly.
data_region 80 9504 9505

# FastROM mirrors ($80) of the bank $00 directives: the analyzer emits
# separate bodies for code reached through $80:xxxx.
indirect_dispatch C3C8 17 ptrtail targets:80C3AF,80C440,80C445,80C463,80C481,80C4A7,80C4EF,80C534,80C546,80C5BA,80C5C2,80C60F,80C617,80C664,80C66C,80C6AA,80C6C4
exit_mx_at 80C3AB 1 0
indirect_dispatch E238 1 ptrtail targets:80E23B
indirect_dispatch E283 1 ptrtail targets:80E286
indirect_dispatch C7AA 3 ptrtail targets:80C7B3,80C857,80C937
# $C775 does PHP ; REP #$20 and tail-dispatches here; every handler ends
# PLP ; RTS, so $C775 returns in its entry mode (the solver sees the PLP
# without the PHP). Without this the league flow's $BC5C continues at M=0.
exit_mx_variant 80C775 0 0 0 0
exit_mx_variant 80C775 1 0 1 0

# Mode-indexed pointer calls: PER <ret-1> ; JMP ($005D) with $5D loaded
# from a table indexed by the game mode $9B (6 modes, cf. the main-loop
# table at $88B2). $AA08 holds code only at index 0 ($AA0C, right after the
# table); $D574 holds the 4 Records screens (the words after it point at
# their title strings, e.g. $D586 = "TRACK__RECORDS"). Unlisted indices keep the
# interpreter default.
indirect_dispatch A9D5 1 ptrcall return:A9D8 frame:2 targets:80AA0C
indirect_dispatch D54F 4 ptrcall return:D552 frame:2 targets:80D5D9,80D7C0,80DAC2,80DDE6

# Boot init clears $7E/$7F WRAM in a loop straight-line from $91D1 (after
# SEP #$20 / REP #$10). Bounded to the loop so it compiles on its own; the
# rest of init continues through normal dispatch at $9302.
func Reset_ClearWRAM 92F2 end:9302 entry_mx:1,0

# Frame cuts land on the clear loop's head ($92F7); bound that resume root
# to the loop as well.
func Reset_ClearWRAM_loop80 92F7 end:9302 entry_mx:1,0

# JMP ($005D) at $B1EA: table at $B1ED indexed by SRAM $77:074B & 3 (event
# type 0-2; the fourth word is text, "ra...").
indirect_dispatch B1EA 3 ptrtail targets:80B21B,80B229,80B260

# Pointer call at $9572: PER $9574 ; JMP ($005D), table $95A5 indexed by the
# event type (SRAM $77:074B = tour slot mod 3: race, lap race, stunts). The
# fourth word ($DA48) is the next string, not a handler.
indirect_dispatch 9572 3 ptrcall return:9575 frame:2 targets:80CE7F,808D6E,80F0D8
# $951C itself returns M=1: the continuation at $9575 does SEP #$20 and every
# later callee returns M=1. (The solver adds the handlers' M=0 exits to it.)
exit_mx_variant 80951C 1 0 1 0
# Mode pointer call at $AE20: 5-entry table at $AE77 (first entry = $AE81,
# right after the table).
indirect_dispatch AE20 5 ptrcall return:AE23 frame:2 targets:80AE81,80AEBF,80AEE4,80AF0C,80AED7

# Title/menu screen ($ABB9, called from the main loop at $889A) and the
# Records screens reach each other through tail dispatches, a cycle the exit
# solver cannot close. $ABB9 never changes the index width and returns with
# M=1; its only caller continues with a width-independent REP #$20.
exit_mx_at 80ABB9 1 0

# Records screen $B17E: PHP at entry, PLP ; RTS at $B4AD -> exits in its entry
# mode (its other exit, BRL $8881, re-enters the main loop and never returns).
exit_mx_variant 80B17E 0 0 0 0
exit_mx_variant 80B17E 1 0 1 0

# Main loop mode dispatch: PER $88AD ; JMP ($005D), 6-entry table at $88B2
# indexed by the game mode $9B (1P, 2P, VS, League, Options, ...).
indirect_dispatch 88AB 6 ptrcall return:88AE frame:2 targets:80BB87,80BCAA,80BF34,80BDBF,80B611,8093FB

# $99A4 and $999F (shared tail): PHP ... PLP ; RTS -> exit in the entry mode.
exit_mx_variant 8099A4 0 0 0 0
exit_mx_variant 8099A4 1 0 1 0
exit_mx_variant 80999F 0 0 0 0
exit_mx_variant 80999F 1 0 1 0

# JMP ($005D) at $FBE6: 3-entry table at $FC13 indexed by $9B (the words at
# $FBE9 are string pointers: "KEEP_SCORES", "RESET_SCORES", ...).
indirect_dispatch FBE6 3 ptrtail targets:80FC38,80FC1C,80FC3D

# Pointer call at $B641 (PER $B643): table $B6AD indexed by the mode $9B;
# 4 code entries (1P, 2P, VS, League; the 5th word is not code).
indirect_dispatch B641 4 ptrcall return:B644 frame:2 targets:80D518,80C115,80D437,809BC4
# Pointer call at $CF73 (PER $CF75): 6-entry table at $CF80 (first entry
# $CF8C starts right after it).
indirect_dispatch CF73 6 ptrcall return:CF76 frame:2 targets:80CF8C,80CF90,80CFF6,80D061,80D088,80D0AF

# $E53A (VS/League setup): PHP at entry, PLP ; RTS at $E634 -> exits in its
# entry mode.
exit_mx_variant 80E53A 0 0 0 0
exit_mx_variant 80E53A 1 0 1 0

# $E838: PHP at entry, PLP ; RTS at $EA19 -> exits in its entry mode (the
# solver's {M0X0, M1X0} set forked callers such as the VS handler into
# 16-bit decodes of 8-bit code).
exit_mx_variant 80E838 0 0 0 0
exit_mx_variant 80E838 1 0 1 0
# $AF0C: SEP #$20 at entry, RTS at $AF44 in M=1.
exit_mx_variant 80AF0C 0 0 1 0
exit_mx_variant 80AF0C 1 0 1 0

