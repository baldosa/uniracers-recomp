# Uniracers (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs
# Generated code charges guest bus accesses at their region speed (and the
# rest as fetch + internal cycles), matching the interpreter tier's clock.
paced_bus

# Reset vector $8858, native NMI $8588 (from the cartridge header).

# I_NMI dispatches through the per-mode handler pointer: JML [$0053].
# The ROM installs exactly three handlers (LDX #ptr / LDA #$80 / STX $53 /
# STA $55 at $80:A165, $82:D74D, $82:DE1B).
indirect_dispatch 8599 3 ptrtail targets:80F60C,808610,8085A5

# Text renderer control codes ($EF-$FF): JMP ($005D) through the 17-entry
# table at $80:C3CB (code $EE would index the SEP #$20 after it; never used).
indirect_dispatch C3C8 17 ptrtail targets:00C3AF,00C440,00C445,00C463,00C481,00C4A7,00C4EF,00C534,00C546,00C5BA,00C5C2,00C60F,00C617,00C664,00C66C,00C6AA,00C6C4

# The text renderer recurses through its own control-code handlers
# (e.g. $C47A JSR $C3AB), which the exit solver cannot close. Every exit
# goes through $C440: SEP #$20 / PLA / PLY / RTS, and X is never changed.
exit_mx_at 00C3AB 1 0

# $00:0199 is a self-modifying RAM trampoline: MVN $00,<bank> ; RTL, the
# source bank patched into $019B by each caller ($80:9B2F/9B55/9B79...).
# Neither instruction changes P, so it returns in its entry mode.
exit_mx_at 000199 0 0
hle_func 0199 HleRamBlockMove

# Patchable hooks: JMP ($0056) / JMP ($0058) in the screen-transition loops.
# $56/$58 hold $3B/$86 and the high bytes ($57/$59, initialised to $E2)
# make them fall through to the next instruction; observed landings agree.
indirect_dispatch E238 1 ptrtail targets:00E23B
indirect_dispatch E283 1 ptrtail targets:00E286
# JMP ($005D) at $C7AA: 3-entry table at $C7AD indexed by SRAM $77:074B & 3
# (the code that follows the table starts at $C7B3, so index 3 never occurs).
indirect_dispatch C7AA 3 ptrtail targets:00C7B3,00C857,00C937
# $C775 does PHP ; REP #$20 and tail-dispatches here; every handler ends
# PLP ; RTS, so $C775 returns in its entry mode (the solver sees the PLP
# without the PHP). Without this the league flow's $BC5C continues at M=0.
exit_mx_variant 00C775 0 0 0 0
exit_mx_variant 00C775 1 0 1 0

# Mode-indexed pointer calls: PER <ret-1> ; JMP ($005D) with $5D loaded
# from a table indexed by the game mode $9B (6 modes, cf. the main-loop
# table at $88B2). $AA08 holds code only at index 0 ($AA0C, right after the
# table); $D574 holds the 4 Records screens (the words after it point at
# their title strings, e.g. $D586 = "TRACK__RECORDS"). Unlisted indices keep the
# interpreter default.
indirect_dispatch A9D5 1 ptrcall return:A9D8 frame:2 targets:00AA0C
indirect_dispatch D54F 4 ptrcall return:D552 frame:2 targets:00D5D9,00D7C0,00DAC2,00DDE6

# Frame cuts land on the clear loop's head ($92F7); bound that resume root
# to the loop as well.
func Boot_ClearWRAM_92F7 92F7 end:9302 entry_mx:1,0

# JMP ($005D) at $B1EA: table at $B1ED indexed by SRAM $77:074B & 3 (event
# type 0-2; the fourth word is text, "ra...").
indirect_dispatch B1EA 3 ptrtail targets:00B21B,00B229,00B260

# Pointer call at $9572: PER $9574 ; JMP ($005D), table $95A5 indexed by the
# event type (SRAM $77:074B = tour slot mod 3: race, lap race, stunts). The
# fourth word ($DA48) is the next string, not a handler.
indirect_dispatch 9572 3 ptrcall return:9575 frame:2 targets:00CE7F,008D6E,00F0D8
# $951C itself returns M=1: the continuation at $9575 does SEP #$20 and every
# later callee returns M=1. (The solver adds the handlers' M=0 exits to it.)
exit_mx_variant 00951C 1 0 1 0
# Mode pointer call at $AE20: 5-entry table at $AE77 (first entry = $AE81,
# right after the table).
indirect_dispatch AE20 5 ptrcall return:AE23 frame:2 targets:00AE81,00AEBF,00AEE4,00AF0C,00AED7

# Title/menu screen ($ABB9, called from the main loop at $889A) and the
# Records screens reach each other through tail dispatches, a cycle the exit
# solver cannot close. $ABB9 never changes the index width and returns with
# M=1; its only caller continues with a width-independent REP #$20.
exit_mx_at 00ABB9 1 0

# Records screen $B17E: PHP at entry, PLP ; RTS at $B4AD -> exits in its entry
# mode (its other exit, BRL $8881, re-enters the main loop and never returns).
exit_mx_variant 00B17E 0 0 0 0
exit_mx_variant 00B17E 1 0 1 0

# Main loop mode dispatch: PER $88AD ; JMP ($005D), 6-entry table at $88B2
# indexed by the game mode $9B (1P, 2P, VS, League, Options, ...).
indirect_dispatch 88AB 6 ptrcall return:88AE frame:2 targets:00BB87,00BCAA,00BF34,00BDBF,00B611,0093FB

# $99A4 and $999F (shared tail): PHP ... PLP ; RTS -> exit in the entry mode.
exit_mx_variant 0099A4 0 0 0 0
exit_mx_variant 0099A4 1 0 1 0
exit_mx_variant 00999F 0 0 0 0
exit_mx_variant 00999F 1 0 1 0

# JMP ($005D) at $FBE6: 3-entry table at $FC13 indexed by $9B (the words at
# $FBE9 are string pointers: "KEEP_SCORES", "RESET_SCORES", ...).
indirect_dispatch FBE6 3 ptrtail targets:00FC38,00FC1C,00FC3D

# Pointer call at $B641 (PER $B643): table $B6AD indexed by the mode $9B;
# 4 code entries (1P, 2P, VS, League; the 5th word is not code).
indirect_dispatch B641 4 ptrcall return:B644 frame:2 targets:00D518,00C115,00D437,009BC4
# Pointer call at $CF73 (PER $CF75): 6-entry table at $CF80 (first entry
# $CF8C starts right after it).
indirect_dispatch CF73 6 ptrcall return:CF76 frame:2 targets:00CF8C,00CF90,00CFF6,00D061,00D088,00D0AF

# $E53A (VS/League setup): PHP at entry, PLP ; RTS at $E634 -> exits in its
# entry mode.
exit_mx_variant 00E53A 0 0 0 0
exit_mx_variant 00E53A 1 0 1 0

# $E838: PHP at entry, PLP ; RTS at $EA19 -> exits in its entry mode (the
# solver's {M0X0, M1X0} set forked callers such as the VS handler into
# 16-bit decodes of 8-bit code).
exit_mx_variant 00E838 0 0 0 0
exit_mx_variant 00E838 1 0 1 0
# $AF0C: SEP #$20 at entry, RTS at $AF44 in M=1.
exit_mx_variant 00AF0C 0 0 1 0
exit_mx_variant 00AF0C 1 0 1 0

