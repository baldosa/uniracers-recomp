# Uniracers (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8858, native NMI $8588 (from the cartridge header).

# I_NMI dispatches through the per-mode handler pointer: JML [$0053].
# The ROM installs exactly three handlers (LDX #ptr / LDA #$80 / STX $53 /
# STA $55 at $80:A165, $82:D74D, $82:DE1B).
indirect_dispatch 8599 3 ptrtail targets:80F60C,808610,8085A5

# Text renderer control codes ($EF-$FF): JMP ($005D) through the 17-entry
# table at $80:C3CB (code $EE would index the SEP #$20 after it; never used).
indirect_dispatch C3C8 17 ptrtail targets:00C3AF,00C440,00C445,00C463,00C481,00C4A7,00C4EF,00C534,00C546,00C5BA,00C5C2,00C60F,00C617,00C664,00C66C,00C6AA,00C6C4

# The text renderer recurses through its own control-code handlers
# (e.g. $C47A JSR $C3AB), which the exit solver cannot close. Every exit
# goes through $C440: SEP #$20 / PLA / PLY / RTS, and X is never changed.
exit_mx_at 00C3AB 1 0

# $00:0199 is a self-modifying RAM trampoline: MVN $00,<bank> ; RTL, the
# source bank patched into $019B by each caller ($80:9B2F/9B55/9B79...).
# Neither instruction changes P, so it returns in its entry mode.
exit_mx_at 000199 0 0

# Patchable hooks: JMP ($0056) / JMP ($0058) in the screen-transition loops.
# $56/$58 hold $3B/$86 and the high bytes ($57/$59, initialised to $E2)
# make them fall through to the next instruction; observed landings agree.
indirect_dispatch E238 1 ptrtail targets:00E23B
indirect_dispatch E283 1 ptrtail targets:00E286
# JMP ($005D) at $C7AA: 3-entry table at $C7AD indexed by SRAM $77:074B & 3
# (the code that follows the table starts at $C7B3, so index 3 never occurs).
indirect_dispatch C7AA 3 ptrtail targets:00C7B3,00C857,00C937

